name: Agilemd
description: >-
  AgileMD is a clinical decision support company that embeds real-time
  predictive analytics and evidence-based clinical pathways directly into
  hospital electronic health record (EHR) workflows such as Epic and Cerner.
  Its FDA-cleared eCART Clinical Deterioration Suite continuously scores
  patient risk from nearly 100 real-time variables — labs, vital signs, and
  nursing assessments — to help care teams recognize deteriorating patients
  earlier, while its Clinical Pathways product standardizes evidence-based
  order sets, documentation, and protocols across care settings. AgileMD is
  used across 400+ hospitals by more than 150,000 clinical users and has
  processed millions of patient encounters. The company is backed by
  Y Combinator, MATTER, and Rock Health.
